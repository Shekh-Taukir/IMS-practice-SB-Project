spring.application.name=IMS_v2

#//Start Jun 15, 2026 TaukirS (ER 1001 - Project Setup for patient mst)
#changed the port of the server for accessing it.
server.port=9081

#//Jun 19, 2026 TaukirS (ER 1002 - patient mst apis)
#server.servlet.context-path="/ims"

#------------------------------------ DB Configs

# connect the postgres DB with the server.
spring.datasource.url=jdbc:postgresql://localhost:5432/practice_ims_v2
spring.datasource.username=postgres
spring.datasource.password=admin

#//Jul 29, 2026 TaukirS (ER 1011 - flyway integration & add office and provider in patient) -> as we are adding flyway integration with project,
# so now we need to set this value to validate or none, as from now onwards we will be managing the db migrations via flyway, and not to hibernate.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

#------------------------------------ DB Configs

#//Jul 24, 2026 TaukirS (ER 1007 - logging and dto to record changes)
logging.level.com.tsTech.practice.IMS_v2 = debug

#//Start Jul 29, 2026 TaukirS (ER 1011 - flyway integration & add office and provider in patient)
#------------------------------------Flyway Configs
spring.flyway.enabled=true

#this path basically refers to resources/db/migrations
# //Aug 16, 2026 TaukirS (ER 1012 - visit type entity code) - flyway works on db/migration, so need to update the folder name to migration, from migrations
spring.flyway.locations=classpath:db/migration

# Needed only because this DB already has data (not a fresh project).
# Lets Flyway baseline the existing schema as "version 1" instead of
# failing with "non-empty schema without history table" on startup.
# New migrations must start from V2 onward.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

#------------------------------------Flyway Configs
#//End Jul 29, 2026 TaukirS (ER 1011 - flyway integration & add office and provider in patient)

